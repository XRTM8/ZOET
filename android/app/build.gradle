plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) signingPropertiesFile.withInputStream { signingProperties.load(it) }
def signingValue = { name, environment -> System.getenv(environment) ?: signingProperties.getProperty(name) }
def releaseStore = signingValue('storeFile', 'KRMZI_KEYSTORE_PATH')
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !releaseStore) {
    throw new GradleException('Release signing key is required. Configure signing.properties or KRMZI signing environment variables.')
}

android {
    namespace 'com.krmzi.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.krmzi.app"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "2.9.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stableRelease {
            if (releaseStore) {
                storeFile rootProject.file(releaseStore)
                storePassword signingValue('storePassword', 'KRMZI_STORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'KRMZI_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'KRMZI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.stableRelease
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

tasks.register('verifyRustArtifacts') {
    doLast {
        ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'].each { abi ->
            if (!file("src/main/jniLibs/${abi}/libotium_core.so").exists()) {
                throw new GradleException('Build the Rust engine with scripts/build-rust-android.ps1 or .sh before assembling Android.')
            }
        }
        ['otium_ui.js', 'otium_ui_bg.wasm'].each { asset ->
            if (!file("src/main/assets/public/wasm/${asset}").exists()) {
                throw new GradleException('Build and synchronize the Rust UI with scripts/build-rust-ui.ps1 before assembling Android.')
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyRustArtifacts' }
