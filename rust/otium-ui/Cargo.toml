[package]
name = "otium-ui"
version = "2.7.2"
edition = "2021"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
base64 = "0.22.1"
futures-util = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { version = "0.3.107", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "DomTokenList", "DomRect", "CssStyleDeclaration",
  "Event", "EventTarget", "KeyboardEvent", "PointerEvent", "MouseEvent", "TouchEvent", "TouchList", "Touch", "WheelEvent",
  "HtmlVideoElement", "HtmlMediaElement", "HtmlIFrameElement", "HtmlTrackElement", "TextTrackList", "TextTrack", "TextTrackMode", "TimeRanges", "MediaError",
  "AudioContext", "BaseAudioContext", "AudioDestinationNode", "AudioParam", "MediaElementAudioSourceNode", "GainNode",
  "HtmlCanvasElement", "CanvasRenderingContext2d",
  "DragEvent", "DataTransfer", "FileList", "File", "FileReader",
  "TextTrackCueList", "TextTrackCue",
  "HtmlInputElement", "HtmlSelectElement", "HtmlButtonElement", "HtmlImageElement", "HtmlCollection",
  "Request", "RequestInit", "RequestCache", "Response", "Headers", "AbortController", "AbortSignal", "UrlSearchParams", "Url", "Blob",
  "Storage", "Location", "History", "Navigator", "ServiceWorkerContainer", "MediaQueryList", "Performance", "ScrollToOptions", "ScrollBehavior", "FocusOptions", "console", "Gamepad", "GamepadButton"
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
