[package]
name = "otium-core"
version = "2.9.1"
edition = "2021"
license = "ISC"
description = "ZOET by Otium shared native provider, catalogue and streaming engine"

[lib]
name = "otium_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "otium-server"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync", "net", "macros"] }
url = "2.5.8"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
